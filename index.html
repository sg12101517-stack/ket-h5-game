<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>荔枝KET词卡助手 · H5可玩原型 v1</title>
  <style>/* === common.css === */
/* 字号v2：390×844 手机框内正文≥16px、次要≥14px、角标≥12px、按钮≥18px/高≥52px、标题22-28px、英文主词≥24px、行高≥1.4、间距≥12px */
:root {
  --in-oklch: ;
  --c-brand: #FF4769; --c-brand-hi: #FF8FA3; --c-brand-edge: #C81E45;
  --c-word: #1E40AF; --c-word-txt: #1E40AF; --c-word-top: #F0F7FF; --c-word-bot: #DBEAFE; --c-word-border: #93C5FD; --c-word-edge: #2563EB;
  --c-syn: #9A3412; --c-syn-txt: #9A3412; --c-syn-top: #FFFBEB; --c-syn-bot: #FFEDD5; --c-syn-border: #FDBA74; --c-syn-edge: #EA580C;
  --c-pass: #10B981; --c-pass-top: #6EE7B7; --c-pass-bot: #10B981; --c-pass-edge: #047857;
  --c-warn: #92400E; --c-warn-txt: #92400E; --c-warn-top: #FEF9C3; --c-warn-bot: #FDE68A; --c-warn-edge: #D97706;
  --c-gold: #78350F; --c-gold-txt: #78350F; --c-gold-top: #FEF08A; --c-gold-bot: #F59E0B; --c-gold-edge: #B45309;
  --bg-island-sky: linear-gradient(180deg, #38BDF8 0%, #1D4ED8 52%, #132A5E 100%);
  --bg-board-deep: linear-gradient(180deg, #1E296B 0%, #13204A 54%, #0B132B 100%);
  --bg-card: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
  --r-pill: 999px; --r-xl: 24px; --r-lg: 18px; --r-md: 15px; --r-sm: 9px; --safe-wx-r: 96px;
  --hl-gummy-top: inset 0 2.5px 0 rgba(255,255,255,0.86), inset 0 -3px 6px rgba(0,0,0,0.11);
  --sh-tray-inset: inset 0 4px 8px rgba(4,10,30,0.55), 0 2px 0 rgba(255,255,255,0.20);
  --sh-svg-drop: drop-shadow(0 10px 14px rgba(6,12,34,0.50));
}
@supports (background: linear-gradient(in oklch, #fff, #000)) { :root { --in-oklch: in oklch; } }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh; background: radial-gradient(circle at 20% 10%, rgba(255,71,105,0.18), transparent 40%), linear-gradient(180deg, #0F1C3F, #091024);
  color: #F8FAFC; font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 16px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; padding: 14px 12px 24px; -webkit-font-smoothing: antialiased;
}
.ico { width: 18px; height: 18px; flex-shrink: 0; vertical-align: -3px; }
.ico-lg { width: 22px; height: 22px; flex-shrink: 0; }
.screen-col { width: 412px; display: flex; flex-direction: column; gap: 12px; }
.screen-caption, .screen-label {
  background: linear-gradient(180deg, #233B7A, #172857); border: 1.5px solid rgba(147,197,253,0.35);
  border-radius: 16px; padding: 10px 16px; box-shadow: 0 5px 0 #0B1533, inset 0 1.5px 0 rgba(255,255,255,0.25);
  font-size: 15px; font-weight: 900; color: #FFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; margin-bottom: 10px;
}
.phone-frame {
  padding: 11px; border-radius: 48px; background: linear-gradient(145deg, #334155, #0F172A);
  box-shadow: 0 8px 0 #060B19, 0 24px 44px rgba(0,0,0,0.58), inset 0 2px 1px rgba(255,255,255,0.30); position: relative;
}
.phone-screen {
  width: 390px; height: 844px; border-radius: 38px; overflow: hidden; position: relative;
  display: flex; flex-direction: column; user-select: none; isolation: isolate; background: var(--bg-island-sky);
  font-size: 16px; line-height: 1.45;
}
.phone-screen.is-deep { background: var(--bg-board-deep); }
.island-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.zone-hud { min-height: 98px; padding: 14px 16px 8px; display: flex; flex-direction: column; justify-content: center; flex-shrink: 0; position: relative; z-index: 2; }
.zone-board { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative; z-index: 2; }
.zone-footer {
  min-height: 156px; padding: 14px 16px 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
  flex-shrink: 0; position: relative; z-index: 2; background: linear-gradient(0deg, rgba(9,18,44,0.88), rgba(9,18,44,0.28));
  border-top: 1.5px solid rgba(255,255,255,0.20);
}
.gummy-shine { position: relative; }
.gummy-shine::after { content: ""; position: absolute; top: 5px; left: 12px; width: 14px; height: 4.5px; border-radius: var(--r-pill); background: rgba(255,255,255,0.68); rotate: -14deg; pointer-events: none; }
.hud-row { display: flex; align-items: center; justify-content: space-between; padding-right: var(--safe-wx-r); position: relative; min-height: 54px; gap: 12px; }
.hud-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.btn-back-gummy {
  width: 52px; height: 52px; border-radius: 15px; border: 1.5px solid rgba(255,255,255,0.65); background: linear-gradient(180deg, rgba(255,255,255,0.36), rgba(255,255,255,0.16));
  box-shadow: 0 4px 0 rgba(8,20,52,0.45), inset 0 2px 0 rgba(255,255,255,0.78); color: #FFF; display: grid; place-items: center; font-size: 22px; font-weight: 900; line-height: 1.4; cursor: pointer; flex-shrink: 0;
}
.hud-titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hud-main-title, .page-title { font-size: 23px; font-weight: 900; line-height: 1.4; color: #FFF; white-space: nowrap; text-shadow: 0 2px 4px rgba(8,18,48,0.55); }
.hud-sub-title { font-size: 14px; font-weight: 800; line-height: 1.4; color: #FEF08A; white-space: nowrap; }
.streak-pill, .streak-gummy {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: var(--r-pill); background: linear-gradient(180deg, var(--c-gold-top), var(--c-gold-bot));
  color: var(--c-gold-txt); font-size: 14px; font-weight: 900; line-height: 1.4; font-variant-numeric: tabular-nums; box-shadow: 0 3.5px 0 var(--c-gold-edge), var(--hl-gummy-top); white-space: nowrap;
}
.rank-badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: var(--r-pill); background: linear-gradient(135deg, #38BDF8, #2563EB);
  color: #FFF; font-size: 14px; font-weight: 900; line-height: 1.4; border: 1.5px solid #BAE6FD; box-shadow: 0 3px 0 #1E3A8A, inset 0 1.5px 0 rgba(255,255,255,0.75);
}
.wx-capsule {
  position: absolute; right: 0; top: 50%; translate: 0 -50%; width: 86px; height: 34px; border-radius: var(--r-pill); background: rgba(15,23,42,0.52);
  border: 1px solid rgba(255,255,255,0.30); display: flex; align-items: center; justify-content: space-around; padding: 0 8px; font-size: 14px; line-height: 1.4; color: #FFF; backdrop-filter: blur(6px);
}
.wx-capsule-line { width: 1px; height: 15px; background: rgba(255,255,255,0.30); }
progress.ui-progress {
  appearance: none; border: 0 solid; overflow: clip; width: 100%; height: var(--progress-bar-height, 16px);
  border-radius: var(--r-pill); background: rgba(9,18,45,0.72); box-shadow: inset 0 3px 5px rgba(0,0,0,0.48), 0 1.5px 0 rgba(255,255,255,0.28);
}
progress.ui-progress::-webkit-progress-bar { background: transparent; }
progress.ui-progress::-webkit-progress-value { background: linear-gradient(180deg, #6EE7B7, #10B981); border-radius: var(--r-pill); box-shadow: inset 0 2px 0 rgba(255,255,255,0.72); transition: inline-size 0.3s; }
progress.ui-progress::-moz-progress-bar { background: linear-gradient(180deg, #6EE7B7, #10B981); border-radius: var(--r-pill); box-shadow: inset 0 2px 0 rgba(255,255,255,0.72); transition: inline-size 0.3s; }
.btn-gummy {
  border: none; font-family: inherit; font-size: 18px; font-weight: 900; line-height: 1.4; min-height: 52px;
  cursor: pointer; position: relative; transition: translate 80ms cubic-bezier(0.34,1.56,0.64,1), box-shadow 80ms ease;
}
.btn-gummy:active { translate: 0 3px; }
.btn-cta-main {
  flex: 1; min-height: 56px; border-radius: var(--r-lg); background: linear-gradient(180deg, #FF859D, #FF4769);
  color: #FFF; font-size: 19px; font-weight: 900; line-height: 1.4; border: 1.5px solid #FFC2CE;
  box-shadow: 0 6px 0 var(--c-brand-edge), 0 12px 22px rgba(255,71,105,0.38), var(--hl-gummy-top);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
}
.btn-cta-gold {
  flex: 1; min-height: 56px; border-radius: var(--r-lg); background: linear-gradient(180deg, #FEF08A, #F59E0B);
  color: #78350F; font-size: 19px; font-weight: 900; line-height: 1.4; border: 1.5px solid #FEF9C3;
  box-shadow: 0 6px 0 #B45309, 0 12px 22px rgba(245,158,11,0.38), var(--hl-gummy-top);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
}
.btn-square-gummy {
  width: 56px; height: 56px; border-radius: 17px; background: linear-gradient(180deg, #60A5FA, #2563EB);
  border: 1.5px solid #BFDBFE; color: #FFF; display: grid; place-items: center;
  box-shadow: 0 6px 0 #1E40AF, var(--hl-gummy-top); flex-shrink: 0;
}
.cta-bar { display: flex; align-items: center; gap: 12px; }
.bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.nav-tab {
  min-height: 54px; border-radius: 16px; background: rgba(15,26,60,0.78); border: 1.5px solid rgba(147,197,253,0.32);
  color: #E0F2FE; font-size: 18px; font-weight: 900; line-height: 1.4; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 #070E24, inset 0 1.5px 0 rgba(255,255,255,0.18);
}
.nav-tab.is-active {
  background: linear-gradient(180deg, var(--c-brand-hi), var(--c-brand)); border-color: #FFE4EA; color: #FFF;
  box-shadow: 0 4px 0 var(--c-brand-edge), var(--hl-gummy-top);
}
.gem-card {
  min-height: 58px; border-radius: var(--r-md); padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 24px; font-weight: 900; line-height: 1.4; box-shadow: 0 5px 0 var(--edge-c, #2563EB), 0 8px 14px rgba(8,18,48,0.26), var(--hl-gummy-top);
}
.gem-card.is-word { --edge-c: var(--c-word-edge); background: linear-gradient(180deg, var(--c-word-top), var(--c-word-bot)); color: var(--c-word-txt); border: 2px solid var(--c-word-border); }
.gem-card.is-syn { --edge-c: var(--c-syn-edge); background: linear-gradient(180deg, var(--c-syn-top), var(--c-syn-bot)); color: var(--c-syn-txt); border: 2px solid var(--c-syn-border); }
.companion-tray {
  background: rgba(13,29,72,0.72); border: 1.5px solid rgba(186,230,253,0.40); border-radius: 20px;
  padding: 12px 14px; box-shadow: var(--sh-tray-inset); display: flex; align-items: center; gap: 12px;
}
.quiz-main-card {
  background: linear-gradient(180deg, #FFFFFF, #F2F8FF); color: #0F172A; border-radius: 24px; border: 2px solid #BAE6FD;
  padding: 14px 16px; box-shadow: 0 6px 0 #60A5FA, 0 12px 22px rgba(8,18,48,0.36), inset 0 3px 0 #FFF; display: flex; flex-direction: column; gap: 12px;
}
.quiz-opt-btn {
  min-height: 54px; border-radius: 16px; background: linear-gradient(180deg, var(--c-syn-top), var(--c-syn-bot));
  border: 2px solid var(--c-syn-border); color: var(--c-syn-txt); padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 18px; font-weight: 900; line-height: 1.4; box-shadow: 0 4.5px 0 var(--c-syn-edge), var(--hl-gummy-top);
}
.quiz-opt-btn.is-correct { background: linear-gradient(180deg, var(--c-pass-top), var(--c-pass-bot)); border-color: #A7F3D0; color: #FFF; box-shadow: 0 4.5px 0 var(--c-pass-edge), var(--hl-gummy-top); }
.mirror-scroll-card {
  background: linear-gradient(180deg, #ECFDF5, #D1FAE5); border: 2px solid #6EE7B7; border-radius: 20px;
  padding: 12px 14px; color: #064E3B; box-shadow: 0 5px 0 #059669, inset 0 2px 0 #FFF; display: flex; flex-direction: column; gap: 8px;
}
.lock-cloud-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: var(--r-pill);
  background: linear-gradient(180deg, #FEF08A, #F59E0B); color: #78350F; font-size: 14px; font-weight: 900; line-height: 1.4;
  border: 1px solid #FFFBEB; box-shadow: 0 2.5px 0 #B45309; white-space: nowrap;
}
.star-ticks { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 900; line-height: 1.4; color: #FEF08A; }
.footer-note { text-align: center; font-size: 14px; font-weight: 700; line-height: 1.4; color: rgba(226,232,240,0.92); }
.home-bar { width: 124px; height: 4px; border-radius: var(--r-pill); background: rgba(255,255,255,0.35); margin: 0 auto; }
.word-display { font-size: 26px; font-weight: 900; line-height: 1.4; }
.body-text { font-size: 16px; font-weight: 700; line-height: 1.45; }
.sub-text { font-size: 14px; font-weight: 700; line-height: 1.4; }
.badge-corner { font-size: 14px; font-weight: 800; line-height: 1.4; padding: 2px 8px; border-radius: var(--r-pill); }


/* === 390×844 视口零滚动适配与全局交互增强 === */
@media (max-width: 430px) {
  body {
    padding: 0 !important;
    margin: 0 !important;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }
  .screen-col {
    width: 100vw !important;
    height: 100dvh !important;
    gap: 0 !important;
  }
  .screen-caption, .screen-label {
    display: none !important;
  }
  .phone-frame {
    padding: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    background: transparent !important;
    width: 100vw !important;
    height: 100dvh !important;
  }
  .phone-screen {
    width: 100vw !important;
    height: 100dvh !important;
    border-radius: 0 !important;
  }
}

/* 顶部非模态轻量提示横幅 */
.ket-toast {
  position: absolute;
  top: 14px;
  left: 16px;
  right: 16px;
  z-index: 99;
  padding: 10px 14px;
  border-radius: 16px;
  background: linear-gradient(180deg, #065F46, #047857);
  color: #FEF08A;
  border: 2px solid #6EE7B7;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
  font-size: 16px;
  font-weight: 900;
  line-height: 1.4;
  text-align: center;
  pointer-events: none;
}
.ket-toast.is-warn {
  background: linear-gradient(180deg, #92400E, #78350F);
  border-color: #FDE68A;
  color: #FEF9C3;
}

/* 晶石选中与抖动反馈 */
.gem-btn.is-selected {
  outline: 3px solid #FEF08A !important;
  translate: 0 -2px;
}
.is-wrong-shake {
  border-color: #F59E0B !important;
  background: linear-gradient(180deg, #FEF9C3, #FDE68A) !important;
  color: #92400E !important;
}
@media (prefers-reduced-motion: no-preference) {
  @keyframes ketAmberShake {
    0%, 100% { translate: 0 0; }
    25% { translate: -5px 0; }
    75% { translate: 5px 0; }
  }
  .is-wrong-shake {
    animation: ketAmberShake 0.28s ease;
  }
}

/* 在线默写卡内嵌输入框（保持高保真视觉同时支持真实键盘输入） */
.dict-inline-input {
  width: 100%;
  min-width: 0;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 16px;
  font-weight: 900;
  line-height: 1.4;
  color: inherit;
  outline: none;
}
.dict-inline-input::placeholder {
  color: #64748B;
  font-weight: 700;
}

/* 岛屿卡片与可点击项手型 */
.island-card, .sanctuary-card, .quest-item, .vocab-card, .wrong-item-card, .day-row, .scene-chip, .dict-tab, .setting-row {
  cursor: pointer;
}

/* 针对 P07 / P15 / P18 / P20 容器内边距与间距微调，确保 390×844 严苛零滚动 (scrollHeight <= 844) */
.phone-screen.page-P07 .zone-hud,
.phone-screen.page-P15 .zone-hud,
.phone-screen.page-P18 .zone-hud,
.phone-screen.page-P20 .zone-hud {
  min-height: 70px;
  padding: 8px 16px 4px;
}
.phone-screen.page-P07 .zone-board,
.phone-screen.page-P15 .zone-board,
.phone-screen.page-P18 .zone-board,
.phone-screen.page-P20 .zone-board {
  padding: 6px 16px;
  gap: 8px;
}
.phone-screen.page-P07 .zone-footer,
.phone-screen.page-P15 .zone-footer,
.phone-screen.page-P20 .zone-footer {
  min-height: 84px;
  padding: 8px 16px 10px;
  gap: 6px;
}
.phone-screen.page-P07 .opt-stack { gap: 8px; }
.phone-screen.page-P07 .quiz-main-card { padding: 10px 14px; gap: 8px; }
.phone-screen.page-P15 .retry-hero-card { padding: 10px 14px; gap: 6px; }
.phone-screen.page-P15 .warn-review-card { padding: 10px 14px; gap: 8px; }
.phone-screen.page-P15 .stage-check-box { padding: 8px 10px; gap: 6px; }
.phone-screen.page-P18 .zone-footer {
  min-height: 124px;
  padding: 8px 16px 10px;
  gap: 6px;
}
.phone-screen.page-P01 .hud-row { gap: 6px !important; padding-right: 90px !important; }
.phone-screen.page-P01 .streak-pill { padding: 4px 8px !important; }
.phone-screen.page-P01 .hud-sub-title { letter-spacing: -0.4px; }
.phone-screen.page-P18 .guide-filter-panel { padding: 6px 12px !important; gap: 4px !important; }
.phone-screen.page-P18 .vocab-stack { gap: 6px !important; }
.phone-screen.page-P18 .vocab-card { padding: 6px 12px !important; gap: 4px !important; }
.phone-screen.page-P20 .mastery-summary-card { padding: 8px 12px !important; gap: 4px !important; }
.phone-screen.page-P20 .checkin-table-card { padding: 8px 12px !important; gap: 6px !important; }
.phone-screen.page-P20 .day-grid { gap: 6px !important; }
.phone-screen.page-P20 .day-row { padding: 4px 8px !important; gap: 2px !important; }


/* === views.css === */
/* 荔枝KET词卡助手 v1 - P01至P21 页面专属样式（提取自高保真稿并隔离作用域，全部字号>=14px） */

/* ==================== P01: P01_品牌启动首页与今日3步微任务.html ==================== */
.phone-screen.page-P01 .hero-card {
      background: linear-gradient(160deg, rgba(30,58,138,0.86), rgba(15,23,42,0.92));
      border: 2px solid rgba(186,230,253,0.48); border-radius: 24px; padding: 14px 16px;
      box-shadow: 0 6px 0 #0B1536, 0 12px 22px rgba(6,12,34,0.42), inset 0 2px 0 rgba(255,255,255,0.28);
      display: flex; flex-direction: column; gap: 12px;
    }
.phone-screen.page-P01 .hero-top { display: flex; align-items: center; gap: 14px; }

.phone-screen.page-P01 .hero-meta { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.phone-screen.page-P01 .hero-title { font-size: 22px; font-weight: 900; line-height: 1.4; color: #FFF; }

    }
.phone-screen.page-P01 .word-main-en { font-size: 25px; font-weight: 900; line-height: 1.4; color: #BFDBFE; }
.phone-screen.page-P01 .word-sub-syn { font-size: 16px; font-weight: 800; line-height: 1.4; color: #FED7AA; }
.phone-screen.page-P01 .daily-quest-bar {
      background: linear-gradient(180deg, #FFFFFF, #F4F9FF); color: #0F172A; border-radius: 24px;

      display: flex; flex-direction: column; gap: 12px;
    }
.phone-screen.page-P01 .quest-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.phone-screen.page-P01 .quest-title { font-size: 22px; font-weight: 900; line-height: 1.4; color: #0F172A; display: flex; align-items: center; gap: 12px; }

// 荔枝KET词卡助手 v1 - 离线音效与剑桥英音（en-GB）分包控制器（含 30% 自动闪避与防泄题门禁）
(function () {
  var ctx = null;
  var isSpeaking = false;

  function getCtx() {
    if (!ctx) {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        try { ctx = new AudioCtx(); } catch (e) { ctx = null; }
      }
    }
    if (ctx && ctx.state === "suspended") {
      try { ctx.resume(); } catch (e) {}
    }
    return ctx;
  }

  function getGainMultiplier() {
    var st = window.KET_STATE ? window.KET_STATE.get() : null;
    if (st && st.settings && st.settings.muted) return 0;
    var ducking = !st || !st.settings || st.settings.audioDucking !== false;
    return (isSpeaking && ducking) ? 0.30 : 1.0;
  }

  function playTone(freq, durationMs, type, startDelayMs) {
    var mult = getGainMultiplier();
    if (mult <= 0) return;
    var c = getCtx();
    if (!c) return;
    try {
      var osc = c.createOscillator();
      var gain = c.createGain();
      var now = c.currentTime + (startDelayMs || 0) / 1000;
      var dur = (durationMs || 90) / 1000;
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.12 * mult, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + dur);
    } catch (e) {}
  }

  var PENTATONIC = [523.25, 587.33, 659.25, 783.99, 1046.50]; // C5, D5, E5, G5, C6

  window.KET_AUDIO = {
    tap: function () {
      playTone(440, 55, "triangle", 0);
    },
    playClick: function () {
      this.tap();
    },
    playKey: function () {
      playTone(523.25, 45, "sine", 0);
    },
    burst: function () {
      playTone(587.33, 80, "sine", 0);
      playTone(880.0, 110, "triangle", 55);
    },
    playMatch: function (combo) {
      this.correct(combo);
    },
    correct: function (combo) {
      var idx = Math.max(0, Math.min(4, (combo || 1) - 1));
      var base = PENTATONIC[idx];
      playTone(base, 95, "sine", 0);
      playTone(base * 1.25, 130, "triangle", 65);
    },
    playCorrect: function (combo) {
      this.correct(combo);
    },
    wrong: function () {
      // 柔和琥珀木琴低音
      playTone(293.66, 120, "sine", 0);
      playTone(246.94, 160, "sine", 80);
    },
    playWrong: function () {
      this.wrong();
    },
    laser: function () {
      playTone(987.77, 70, "sawtooth", 0);
      playTone(659.25, 110, "triangle", 45);
    },
    playLaser: function () {
      this.laser();
    },
    chest: function () {
      playTone(523.25, 80, "sine", 0);
      playTone(659.25, 80, "sine", 70);
      playTone(783.99, 140, "triangle", 140);
    },
    star: function () {
      playTone(659.25, 90, "sine", 0);
      playTone(880.0, 120, "sine", 80);
      playTone(1046.5, 180, "triangle", 160);
    },
    playFanfare: function () {
      this.star();
    },
    speakCard: function (card, mode) {
      return this.speakVocab(card, mode);
    },
    /**
     * 播放词对离线英音（仅覆盖 100 组 word / syn 词对，不读 example 例句）
     * @param {Object} card 词卡对象 { id, word, syn }
     * @param {string} mode 'word_only' | 'syn_only' | 'pair'
     */
    speakVocab: function (card, mode) {
      if (!card) return "";
      var st = window.KET_STATE ? window.KET_STATE.get() : null;
      if (st && st.settings && st.settings.muted) return "";
      // 严守反向题防泄题铁律：作答前 mode === 'syn_only' 仅播 syn
      var textToSpeak = "";
      if (mode === "syn_only") {
        textToSpeak = card.syn;
      } else if (mode === "word_only") {
        textToSpeak = card.word;
      } else {
        textToSpeak = card.word + ", " + card.syn;
      }
      isSpeaking = true;
      try {
        if ("speechSynthesis" in window && window.SpeechSynthesisUtterance) {
          window.speechSynthesis.cancel();
          var u = new window.SpeechSynthesisUtterance(textToSpeak.replace(/\//g, " or "));
          u.lang = "en-GB";
          u.rate = 0.95;
          u.onend = function () { isSpeaking = false; };
          u.onerror = function () { isSpeaking = false; };
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
      setTimeout(function () { isSpeaking = false; }, 1200);
      return textToSpeak;
    }
  };
})();

// 荔枝KET词卡助手 v1 - 核心状态机、防泄题/防刷星规则、星级与掌握率计算及 localStorage 持久化
(function () {

      },

      },

      },
      // 当前局内状态
      session: {
        level: 1,

        matchedIds: ["001", "002", "003", "004"],
        burstingId: "004",
        selectedWordId: null,

        combo: 4,
        stage2Index: 4, // 0-based (4 = 第5题)
        stage2Correct: 9,
        stage3Index: 2,
        stage3Correct: 10,
        stage3Typed: ["p", "a", "r", "t", "i", "c", "i", "p", "a", "t"],

        }

  }

  var state = createDefaultState();

  function load() {

      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          state = Object.assign(createDefaultState(), parsed);
          state.levels = Object.assign(createDefaultState().levels, parsed.levels || {});
          state.dailyQuests = Object.assign(createDefaultState().dailyQuests, parsed.dailyQuests || {});
          state.settings = Object.assign(createDefaultState().settings, parsed.settings || {});
          state.session = Object.assign(createDefaultState().session, parsed.session || {});
          // 检查连胜断签规则：断签 1 天即清零、不可补签
          checkStreakContinuity();
        }
      } else {
        state = createDefaultState();
      }
    } catch (e) {
      state = createDefaultState();
    }
    return state;
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function checkStreakContinuity() {
    if (!state.lastActiveDate) return;
    try {
      var last = new Date(state.lastActiveDate + "T00:00:00");
      var now = new Date("2026-11-12T00:00:00");
      var diffDays = Math.round((now - last) / (1000 * 60 * 60 * 24));
      if (diffDays > 1) {
        state.streakDays = 0;
      }
    } catch (e) {}
  }

  function getVocabMap() {
    var map = {};
    var list = (window.KET_DATA && window.KET_DATA.VOCAB_100) || [];
    for (var i = 0; i < list.length; i++) {
      map[list[i].id] = list[i];
    }
    return map;
  }

  function getLevelCards(level) {
    var list = (window.KET_DATA && window.KET_DATA.VOCAB_100) || [];
    var lv = Math.max(1, Math.min(10, parseInt(level, 10) || 1));
    var start = (lv - 1) * 10;
    return list.slice(start, start + 10);
  }

  function isOverlap(idA, idB) {
    if (idA === idB) return true;
    for (var i = 0; i < OVERLAP_GROUPS.length; i++) {
      var g = OVERLAP_GROUPS[i];
      if (g.indexOf(idA) !== -1 && g.indexOf(idB) !== -1) return true;
    }
    return false;
  }

  /**
   * 反向题防泄题挖空规则：将 example 中的目标原词及词形变化（s/es/d/ed/led/ing）替换为 ______
   */
  function maskExample(example, word) {
    if (!example || !word) return example || "";
    var escaped = word.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // 若原词以 e 结尾（如 postpone），兼容 postponed / postponing
    var stem = escaped.endsWith("e") ? escaped.slice(0, -1) + "e?" : escaped;
    var regex = new RegExp("\\b" + stem + "(?:s|es|d|ed|led|ing)?\\b", "gi");
    var masked = example.replace(regex, '<span class="blank-slot">______</span>');
    if (masked === example) {
      // 兜底大小写不敏感替换
      var idx = example.toLowerCase().indexOf(word.toLowerCase());
      if (idx !== -1) {
        masked =
          example.slice(0, idx) +
          '<span class="blank-slot">______</span>' +
          example.slice(idx + word.length);
      }
    }
    return masked;
  }

  function highlightExample(example, word) {
    if (!example || !word) return example || "";
    var escaped = word.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var stem = escaped.endsWith("e") ? escaped.slice(0, -1) + "e?" : escaped;
    var regex = new RegExp("(\\b" + stem + "(?:s|es|d|ed|led|ing)?\\b)", "i");
    return example.replace(regex, '<span class="example-hl">$1</span>');
  }

  function getDistractors(targetCard, level, count, mixWrongBook) {
    var pool = getLevelCards(level).slice();
    if (mixWrongBook && state.wrongBook) {
      var vmap = getVocabMap();
      Object.keys(state.wrongBook).forEach(function (wid) {
        if (vmap[wid] && !pool.some(function (c) { return c.id === wid; })) {
          pool.push(vmap[wid]);
        }
      });
    }
    var filtered = pool.filter(function (c) {
      return !isOverlap(targetCard.id, c.id);
    });
    return filtered.slice(0, count || 3);
  }

  function addWrongWord(cardId, sourceLabel) {
    if (!cardId) return;
    if (!state.wrongBook[cardId]) {
      state.wrongBook[cardId] = {
        id: cardId,
        count: 0,
        source: sourceLabel || "闯关练习"
      };
    }
    state.wrongBook[cardId].count += 1;
    if (sourceLabel && state.wrongBook[cardId].source.indexOf(sourceLabel) === -1) {
      state.wrongBook[cardId].source += "+" + sourceLabel;
    }
    if (state.session.runWrongIds.indexOf(cardId) === -1) {
      state.session.runWrongIds.push(cardId);
    }
    save();
  }

  function clearWrongWord(cardId) {
    if (!cardId) return;
    if (state.wrongBook[cardId]) {
      delete state.wrongBook[cardId];
    }
    state.recentlyClearedId = cardId;
    state.masteredIds[cardId] = true;
    state.dailyQuests.wrongClearedCount = (state.dailyQuests.wrongClearedCount || 0) + 1;
    save();
  }

  function getWrongListSorted() {
    var vmap = getVocabMap();
    var arr = Object.keys(state.wrongBook || {}).map(function (id) {
      var entry = state.wrongBook[id];
      var card = vmap[id] || { id: id, word: "", syn: "", cn: "" };
      return {
        id: id,
        count: entry.count || 1,
        source: entry.source || "闯关练习",
        word: card.word,
        syn: card.syn,
        cn: card.cn,
        example: card.example,
        reminder: card.reminder
      };
    });
    arr.sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return a.id.localeCompare(b.id);
    });
    return arr;
  }

  /**
   * 评定第 1–10 关星级与下一关解锁（严格遵循 GDD §3.3 & §4）
   * - 单阶段自由练（chain === false）仅记绿勾，不授海岛星章，不解锁下一关
   * - 四阶全通且阶段②>=60%、阶段④守关挑战>=60% 保底 1 星；平均>=80% 得 2 星；>=95% 或复活战清零得 3 星
   */
  function settleIslandRun(level, stage2Pct, stage4Pct, chain, revivedAll) {
    var lvKey = String(level);
    var lvObj = state.levels[lvKey] || { unlocked: true, stars: 0, stage1: false, stage2: 0, stage3: false, stage4: 0 };
    lvObj.stage1 = true;
    lvObj.stage2 = Math.max(lvObj.stage2 || 0, stage2Pct);
    lvObj.stage3 = true;
    lvObj.stage4 = Math.max(lvObj.stage4 || 0, stage4Pct);
    state.dailyQuests.stageDone = true;

    var passed = stage2Pct >= 60 && stage4Pct >= 60;
    var earnedStars = 0;

    if (passed && chain) {
      var avg = (stage2Pct + stage4Pct) / 2;
      if (revivedAll || avg >= 95) {
        earnedStars = 3;
      } else if (avg >= 80) {
        earnedStars = 2;
      } else {
        earnedStars = 1;
      }
      if (earnedStars > (lvObj.stars || 0)) {
        lvObj.stars = earnedStars;
      }
      // 标记本岛 10 词已掌握
      var cards = getLevelCards(level);
      cards.forEach(function (c) {
        state.masteredIds[c.id] = true;
      });
      // 解锁下一关（第2关免费解锁；第3–11关需同时满足 iapUnlocked）
      var nextLv = level + 1;
      if (nextLv <= 11 && state.levels[String(nextLv)]) {
        if (nextLv <= 2 || state.iapUnlocked) {
          state.levels[String(nextLv)].unlocked = true;
        }
      }
    }

    state.levels[lvKey] = lvObj;
    state.session.lastSettlement = {
      level: level,
      stars: earnedStars,
      passed: passed,
      chain: chain,
      stage1Done: true,
      stage2Pct: stage2Pct,
      stage3Done: true,
      stage4Pct: stage4Pct,
      weakCardId: (state.session.runWrongIds && state.session.runWrongIds[0]) || "004"
    };
    save();
    return state.session.lastSettlement;
  }

  /**
   * 评定第 11 关黄金圣殿 20 题巩固测验星级（>=12/20 1星，>=16/20 2星，>=19/20 3星）
   */
  function settleL11Quiz(correctCount) {
    var passed = correctCount >= 12;
    var stars = 0;
    if (correctCount >= 19) stars = 3;
    else if (correctCount >= 16) stars = 2;
    else if (correctCount >= 12) stars = 1;

    var lv11 = state.levels["11"] || { unlocked: true, stars: 0, quizScore: 0 };
    lv11.quizScore = Math.max(lv11.quizScore || 0, correctCount);
    if (stars > (lv11.stars || 0)) lv11.stars = stars;
    state.levels["11"] = lv11;
    state.dailyQuests.stageDone = true;
    if (correctCount === 20) {
      state.checkinDays["Day 7"] = true;
    }
    save();
    return { level: 11, stars: stars, passed: passed, correctCount: correctCount };
  }

  /**
   * 默写卡单题判分规则（严格对齐关卡设计 §2.4.1）：
   * 1. 标准答案大小写/空格归一完全匹配 -> 判对
   * 2. 漏写已印首字母（如 inexpensive 输 nexpensive 或 [i]nexpensive） -> 判对
   * 3. 输入同卡其他同义词（如 costly 题输 high-priced） -> 提示「换一个」不判对也不计错
   * 4. 其他错误 -> 判错并记入 wrongBook
   */
  function gradeDictationItem(questionObj, rawInput, recordWrong) {
    var normAns = (questionObj.answer || "").trim().replace(/\s+/g, " ").toLowerCase();
    var cleanInput = (rawInput || "").trim().replace(/\s+/g, " ").toLowerCase();
    var bracketless = cleanInput.replace(/\[([a-z])\]/g, "$1");

    if (cleanInput === normAns) {
      return { status: "correct", mode: "exact", label: "✓ 标准答案", displayVal: rawInput || questionObj.answer };
    }

    var strippedAns = normAns
      .split(" ")
      .map(function (w) { return w.slice(1); })
      .join(" ");

    if ((strippedAns && cleanInput === strippedAns) || bracketless === normAns) {
      return {
        status: "correct",
        mode: "missing_initial",
        label: "✓ 漏首字母判对",
        displayVal: rawInput.indexOf("[") !== -1 ? rawInput : "[" + normAns[0] + "]" + strippedAns
      };
    }

    // 检查是否属于同卡片下的其他同义词/原词
    var vmap = getVocabMap();
    var card = vmap[questionObj.cardId];
    if (card && cleanInput.length >= 2) {
      var synParts = card.syn.toLowerCase().split("/").map(function (s) { return s.trim(); });
      synParts.push(card.word.toLowerCase().trim());
      var isOtherSyn = synParts.some(function (sp) {
        return sp === cleanInput || (sp.indexOf(cleanInput) !== -1 && cleanInput !== normAns);
      });
      if (isOtherSyn) {
        return {
          status: "swap",
          mode: "synonym_swap",
          label: "同义词 · 换一个(" + normAns[0] + "开头)",
          displayVal: rawInput
        };
      }
    }

    if (recordWrong) {
      addWrongWord(questionObj.cardId, "默写卡");
    }
    return {
      status: "wrong",
      mode: "wrong",
      label: "参考答案: " + questionObj.answer,
      displayVal: rawInput || "未填"
    };
  }

  function getTotalStars() {
    var total = 0;
    Object.keys(state.levels || {}).forEach(function (k) {
      total += state.levels[k].stars || 0;
    });
    return Math.min(33, total);
  }

  function getMasteryStats() {
    var count = Object.keys(state.masteredIds || {}).length;
    return {
      count: count,
      total: 100,
      pct: Math.round((count / 100) * 100)
    };
  }

  function unlockIAP() {
    state.iapUnlocked = true;
    // 解锁 L3（若 L2 已解锁或按打包内购开放）
    for (var i = 3; i <= 11; i++) {
      if (state.levels[String(i)]) {
        state.levels[String(i)].unlocked = true;
      }
    }
    save();
  }

  function resetLocalProgress() {
    var keepIap = state.iapUnlocked;
    state = createDefaultState();
    state.iapUnlocked = keepIap;
    if (keepIap) {
      for (var i = 3; i <= 11; i++) {
        state.levels[String(i)].unlocked = true;
      }
    }
    state.settings.showResetConfirm = false;
    save();
    return state;
  }

  load();

  window.KET_STATE = {
    get: function () { return state; },
    save: save,
    load: load,
    getVocabMap: getVocabMap,
    getLevelCards: getLevelCards,
    maskExample: maskExample,
    highlightExample: highlightExample,
    getDistractors: getDistractors,
    addWrongWord: addWrongWord,
    clearWrongWord: clearWrongWord,
    getWrongListSorted: getWrongListSorted,
    settleIslandRun: settleIslandRun,
    settleL11Quiz: settleL11Quiz,
    gradeDictationItem: gradeDictationItem,
    getTotalStars: getTotalStars,
    getMasteryStats: getMasteryStats,
    unlockIAP: unlockIAP,
    resetLocalProgress: resetLocalProgress
  };
})();

// === tools.js ===
// 荔枝KET词卡助手 v1 - 错题强化营、100词速查宝典与双遮罩抽背、20张填空默写、家长掌握率打卡表与设置隐私控制器 (P17-P21)
(function () {
  window.KET_VIEWS = window.KET_VIEWS || {};

  function bindBottomNav(screenEl, app) {
    var tabs = screenEl.querySelectorAll(".bottom-nav .nav-tab");
    tabs.forEach(function (btn) {
      btn.addEventListener("click", function () {
        window.KET_AUDIO.playClick();
        var txt = (btn.textContent || "").trim();
        if (txt.indexOf("群岛") !== -1) app.go("P03");
        else if (txt.indexOf("宝典") !== -1) app.go("P18");
        else if (txt.indexOf("错题") !== -1) app.go("P17");
        else if (txt.indexOf("默写") !== -1) app.go("P19");
      });
    });
  }

  // ==================== P17: 荔枝错题强化营（读取真实 wrongBook 错频降序 + 零失误清零） ====================
  window.KET_VIEWS.P17 = {
    mount: function (screenEl, app) {
      var st = window.KET_STATE.get();
      var vmap = window.KET_STATE.getVocabMap();

      function renderWrongCamp() {
        var wrongList = window.KET_STATE.getWrongListSorted();
        var pill = screenEl.querySelector(".streak-pill");
        if (pill) pill.textContent = "待清 " + wrongList.length + "词";

        var groupCard = screenEl.querySelector(".wrong-group-card");
        if (groupCard) {
          if (wrongList.length === 0) {
            groupCard.innerHTML =
              '<article class="wrong-item-card" role="listitem">' +
              '<div class="wrong-item-top"><span class="wrong-id-tag">太棒啦！当前错题本已全部清零</span><span class="freq-badge">0 待清</span></div>' +
              '<div class="wrong-pair-row"><span class="wrong-w">100% Clear</span><span class="wrong-s">= 零错题积压</span></div>' +
              "</article>";
          } else {
            groupCard.innerHTML = wrongList
              .slice(0, 3)
              .map(function (item) {
                return (
                  '<article class="wrong-item-card" role="listitem" data-id="' +
                  item.id +
                  '">' +
                  '<div class="wrong-item-top">' +
                  '<span class="wrong-id-tag">#' +
                  item.id +
                  " · " +
                  item.cn +
                  "（" +
                  item.source +
                  "）</span>" +
                  '<span class="freq-badge">累计错 ' +
                  item.count +
                  " 次</span>" +
                  "</div>" +
                  '<div class="wrong-pair-row">' +
                  '<span class="wrong-w">' +
                  item.word +
                  "</span>" +
                  '<span class="wrong-s">= ' +
                  item.syn +
                  "</span>" +
                  "</div>" +
                  "</article>"
                );
              })
              .join("");

            var itemCards = groupCard.querySelectorAll(".wrong-item-card");
            itemCards.forEach(function (cardEl) {
              cardEl.addEventListener("click", function () {
                var cid = cardEl.dataset.id;
                if (!cid) return;
                window.KET_STATE.clearWrongWord(cid);
                window.KET_AUDIO.playCorrect();
                if (vmap[cid]) window.KET_AUDIO.speakCard(vmap[cid], "full");
                app.toast("零失误通过！#" + cid + " " + (vmap[cid] ? vmap[cid].word : "") + " 已清零移出");
                renderWrongCamp();
              });
            });
          }
        }

        // 更新最近清零移出流光卡
        var clearedId = st.recentlyClearedId || "001";
        var clearedCard = vmap[clearedId] || vmap["001"];
        var clearFx = screenEl.querySelector(".wrong-clear-fx");
        if (clearFx && clearedCard) {
          clearFx.innerHTML =
            '<div class="wrong-item-top">' +
            '<span class="wrong-id-tag" style="color:#064E3B">#' +
            clearedCard.id +
            " · " +
            clearedCard.cn +
            "</span>" +
            '<span class="clear-badge">✓ 零失误清零移出</span>' +
            "</div>" +
            '<div class="wrong-pair-row">' +
            '<span class="wrong-w" style="color:#064E3B">' +
            clearedCard.word +
            "</span>" +
            '<span class="wrong-s" style="color:#064E3B">= ' +
            clearedCard.syn +
            "</span>" +
            "</div>";
        }

        var mainBtn = screenEl.querySelector(".btn-cta-main");
        if (mainBtn) {
          mainBtn.textContent =
            wrongList.length > 0
              ? "一键专练高频错词 (" + wrongList.length + "词) ▶"
              : "错题已全部清零 · 返回群岛闯关 ▶";
        }
      }

      renderWrongCamp();

      var mainBtn = screenEl.querySelector(".btn-cta-main");
      if (mainBtn) {
        mainBtn.addEventListener("click", function () {
          var wrongList = window.KET_STATE.getWrongListSorted();
          if (wrongList.length > 0) {
            var topItem = wrongList[0];
            window.KET_STATE.clearWrongWord(topItem.id);
            window.KET_AUDIO.playCorrect();
            if (vmap[topItem.id]) window.KET_AUDIO.speakCard(vmap[topItem.id], "full");
            app.toast("已消灭高频错词 #" + topItem.id + " " + topItem.word + "！");
            renderWrongCamp();
          } else {
            window.KET_AUDIO.playClick();
            app.go("P03");
          }
        });
      }

      bindBottomNav(screenEl, app);
    }
  };

  // ==================== P18: 100词速查宝典与家长双遮罩抽背屋 ====================
  window.KET_VIEWS.P18 = {
    mount: function (screenEl, app) {
      var st = window.KET_STATE.get();
      var allVocab = (window.KET_DATA && window.KET_DATA.VOCAB_100) || [];
      var scenes = (window.KET_DATA && window.KET_DATA.SCENES) || [];
      var activeSceneIdx = 0;

      function renderVocabCards() {
        var scenePrefix = String(activeSceneIdx + 1).padStart(2, "0");
        var filtered = allVocab.filter(function (c) {
          return c.scene.indexOf(scenePrefix) === 0;
        });
        var pair = filtered.slice(0, 2);
        var stack = screenEl.querySelector(".vocab-stack");
        if (!stack || pair.length === 0) return;

        var maskOn = st.vocabBook.maskMode !== false;
        stack.innerHTML = pair
          .map(function (c) {
            var isRevealed = !maskOn || !!(st.vocabBook.revealedIds && st.vocabBook.revealedIds[c.id]);
            if (isRevealed) {
              return (
                '<article class="vocab-card" data-id="' +
                c.id +
                '">' +
                '<div class="vc-head">' +
                "<span>#" +
                c.id +
                " " +
                c.cn +
                " · " +
                c.example +
                "</span>" +
                '<span class="vc-tag">已揭晓</span>' +
                "</div>" +
                '<div class="vc-pair-grid">' +
                '<div class="vc-word gummy-shine">' +
                c.word +
                "</div>" +
                '<div class="vc-syn gummy-shine">' +
                c.syn +
                "</div>" +
                "</div>" +
                '<div class="kd-reminder">替换识别提醒：' +
                c.reminder +
                "</div>" +
                "</article>"
              );
            } else {
              // 双遮罩防偷瞄：同时遮挡 .vc-syn 同义替换与 .kd-reminder 替换识别提醒
              return (
                '<article class="vocab-card mask-quiz-card" data-id="' +
                c.id +
                '">' +
                '<div class="vc-head">' +
                "<span>#" +
                c.id +
                " " +
                c.cn +
                " · " +
                c.example +
                "</span>" +
                '<span class="vc-tag is-wait">待抽背</span>' +
                "</div>" +
                '<div class="vc-pair-grid">' +
                '<div class="vc-word gummy-shine">' +
                c.word +
                "</div>" +
                '<div class="vc-syn">点击揭晓同义替换</div>' +
                "</div>" +
                '<div class="kd-reminder">替换识别提醒已同步遮挡（点击揭晓）</div>' +
                "</article>"
              );
            }
          })
          .join("");

        stack.querySelectorAll(".vocab-card").forEach(function (cardEl) {
          cardEl.addEventListener("click", function () {
            var cid = cardEl.dataset.id;
            st.vocabBook.revealedIds = st.vocabBook.revealedIds || {};
            st.vocabBook.revealedIds[cid] = !st.vocabBook.revealedIds[cid];
            window.KET_STATE.save();
            var vmap = window.KET_STATE.getVocabMap();
            if (vmap[cid]) window.KET_AUDIO.speakCard(vmap[cid], "full");
            renderVocabCards();
          });
        });

        var toggleBtn = screenEl.querySelector(".btn-cta-gold");
        if (toggleBtn) {
          toggleBtn.textContent = maskOn
            ? "遮挡同义词与提醒：开启中 ✓"
            : "遮挡同义词与提醒：已全部展开";
        }
      }

      var chips = screenEl.querySelectorAll(".scene-filter-bar .scene-chip");
      chips.forEach(function (chip, idx) {
        chip.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          chips.forEach(function (c) {
            c.classList.remove("is-on");
          });
          chip.classList.add("is-on");
          activeSceneIdx = idx < scenes.length ? idx : 0;
          renderVocabCards();
        });
      });

      var toggleBtn = screenEl.querySelector(".btn-cta-gold");
      if (toggleBtn) {
        toggleBtn.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          st.vocabBook.maskMode = !st.vocabBook.maskMode;
          if (!st.vocabBook.maskMode) {
            st.vocabBook.revealedIds = { "001": true, "002": true };
          } else {
            st.vocabBook.revealedIds = { "001": true };
          }
          window.KET_STATE.save();
          renderVocabCards();
        });
      }

      renderVocabCards();
      bindBottomNav(screenEl, app);
    }
  };

  // ==================== P19: 20张在线填空默写工坊（漏首字母容错 + 同义词提示换一个） ====================
  window.KET_VIEWS.P19 = {
    mount: function (screenEl, app) {
      var st = window.KET_STATE.get();
      var dictList = (window.KET_DATA && window.KET_DATA.DICTATION_20) || [];
      var activeCardIdx = 0;

      function bindInputSlots() {
        var qRows = screenEl.querySelectorAll(".dict-sheet-card .q-row");
        var cardObj = dictList[activeCardIdx] || dictList[0];
        if (!cardObj) return;

        qRows.forEach(function (row, idx) {
          var slot = row.querySelector(".input-slot");
          var pill = row.querySelector(".status-pill");
          var qItem = cardObj.questions[idx];
          if (!slot || !qItem) return;

          // 点击输入槽可循环演示或直接键盘编辑并实时调用 gradeDictationItem 判分
          slot.setAttribute("contenteditable", "true");
          slot.setAttribute("spellcheck", "false");
          slot.addEventListener("blur", function () {
            var val = (slot.textContent || "").trim();
            if (idx < 3) {
              var res = window.KET_STATE.gradeDictationItem(qItem, val, true);
              slot.classList.toggle("is-warn", res.status !== "correct");
              if (pill) {
                pill.classList.toggle("is-swap", res.status !== "correct");
                pill.textContent = res.label;
              }
            }
          });
        });
      }

      function renderDictationCard(cardIdx) {
        activeCardIdx = cardIdx;
        var cardObj = dictList[cardIdx] || dictList[0];
        if (!cardObj) return;

        var titleEl = screenEl.querySelector(".sheet-title");
        if (titleEl) {
          titleEl.textContent = "默写卡 " + cardObj.cardNo + " (" + cardObj.theme + ")";
        }

        if (cardIdx > 0) {
          var qRows = screenEl.querySelectorAll(".dict-sheet-card .q-row");
          var qs = cardObj.questions;
          if (qRows.length >= 4 && qs.length >= 5) {
            qRows[0].innerHTML =
              '<div class="q-prompt">1. <span class="q-lead-word">' +
              qs[0].prompt.split(" = ")[0] +
              "</span> = " +
              qs[0].prompt.split(" = ").slice(1).join(" = ") +
              "</div>" +
              '<div class="q-ans-bar"><span class="input-slot">' +
              qs[0].answer +
              '</span><span class="status-pill">✓ 标准答案</span></div>';
            qRows[1].innerHTML =
              '<div class="q-prompt">2. ' +
              qs[1].prompt +
              "</div>" +
              '<div class="q-ans-bar"><span class="input-slot">[' +
              qs[1].answer[0] +
              "]" +
              qs[1].answer.slice(1) +
              '</span><span class="status-pill">✓ 漏首字母判对</span></div>';
            qRows[2].innerHTML =
              '<div class="q-prompt">3. ' +
              qs[2].prompt +
              " · 参考答案: " +
              qs[2].answer +
              "</div>" +
              '<div class="q-ans-bar"><span class="input-slot">' +
              qs[2].answer +
              '</span><span class="status-pill">✓ 标准答案</span></div>';
            qRows[3].innerHTML =
              '<div class="q-prompt">4. ' +
              qs[3].prompt +
              " · 5. " +
              qs[4].prompt +
              "</div>" +
              '<div class="q-ans-bar"><span class="input-slot">4. ' +
              qs[3].answer +
              " · 5. " +
              qs[4].answer +
              '</span><span class="status-pill">✓ 4–5题全对</span></div>';
          }
        }
        bindInputSlots();
      }

      var tabs = screenEl.querySelectorAll(".dict-card-tabs .dict-tab");
      tabs.forEach(function (tab, idx) {
        tab.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          if (idx === 2 && !st.iapUnlocked) {
            app.go("P16");
            return;
          }
          tabs.forEach(function (t) {
            t.classList.remove("is-current");
          });
          tab.classList.add("is-current");
          renderDictationCard(idx);
        });
      });

      bindInputSlots();

      var submitBtn = screenEl.querySelector(".btn-cta-main");
      if (submitBtn) {
        submitBtn.addEventListener("click", function () {
          window.KET_AUDIO.playCorrect();
          var qRows = screenEl.querySelectorAll(".dict-sheet-card .q-row");
          var cardObj = dictList[activeCardIdx] || dictList[0];
          if (qRows.length >= 3 && cardObj) {
            var q3 = cardObj.questions[2];
            var slot3 = qRows[2].querySelector(".input-slot");
            var pill3 = qRows[2].querySelector(".status-pill");
            if (slot3 && q3) {
              slot3.textContent = q3.answer;
              var graded = window.KET_STATE.gradeDictationItem(q3, q3.answer, false);
              slot3.classList.remove("is-warn");
              if (pill3) {
                pill3.classList.remove("is-swap");
                pill3.textContent = graded.label;
              }
            }
          }
          st.dailyQuests.dictationDone = true;
          window.KET_STATE.save();
          submitBtn.textContent = "本卡 5 题全对通过 ✓";
          app.toast("默写卡批改完成！5 题全部达标，今日微任务③已完成");
        });
      }

      bindBottomNav(screenEl, app);
    }
  };

  // ==================== P20: 家长端掌握率总览与7天复习打卡表 ====================
  window.KET_VIEWS.P20 = {
    mount: function (screenEl, app) {
      var st = window.KET_STATE.get();
      var stats = window.KET_STATE.getMasteryStats();

      var backBtn = screenEl.querySelector(".btn-back-gummy");
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          app.go("P01");
        });
      }

      var statSpan = screenEl.querySelector(".summary-stat");
      var prog = screenEl.querySelector(".mastery-summary-card progress.ui-progress");
      if (statSpan) {
        statSpan.textContent = "已掌握 " + stats.count + " / " + stats.total + " (" + stats.pct + "%)";
      }
      if (prog) {
        prog.value = stats.count;
      }

      var dayRows = screenEl.querySelectorAll(".day-grid .day-row");
      dayRows.forEach(function (row, idx) {
        var dayKey = "Day " + (idx + 1);
        var isChecked = !!st.checkinDays[dayKey];
        row.classList.toggle("is-done", isChecked);
        var tag = row.querySelector(".day-tag");
        if (tag) {
          var baseTxt = idx === 6 ? "100%全对" : "90%以上";
          tag.textContent = isChecked ? "✓ " + baseTxt : baseTxt;
        }
        row.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          st.checkinDays[dayKey] = !st.checkinDays[dayKey];
          window.KET_STATE.save();
          var nowChecked = !!st.checkinDays[dayKey];
          row.classList.toggle("is-done", nowChecked);
          if (tag) {
            var bTxt = idx === 6 ? "100%全对" : "90%以上";
            tag.textContent = nowChecked ? "✓ " + bTxt : bTxt;
          }
        });
      });

      var signBtn = screenEl.querySelector(".btn-cta-gold");
      if (signBtn) {
        signBtn.addEventListener("click", function () {
          window.KET_AUDIO.playFanfare();
          for (var d = 1; d <= 7; d++) {
            var dk = "Day " + d;
            if (!st.checkinDays[dk]) {
              st.checkinDays[dk] = true;
              break;
            }
          }
          window.KET_STATE.save();
          app.toast("家长复盘签字确认成功！已同步更新7天打卡表");
          app.go("P20");
        });
      }
    }
  };

  // ==================== P21: 设置、离线英音分包与儿童隐私保护 ====================
  window.KET_VIEWS.P21 = {
    mount: function (screenEl, app) {
      var st = window.KET_STATE.get();
      var vmap = window.KET_STATE.getVocabMap();

      var backBtn = screenEl.querySelector(".btn-back-gummy");
      if (backBtn) {
        backBtn.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          app.go("P01");
        });
      }

      var rows = screenEl.querySelectorAll(".setting-privacy-panel .setting-row");
      if (rows.length >= 2) {
        // 第1行：剑桥英音试听
        rows[0].addEventListener("click", function () {
          window.KET_AUDIO.speakCard(vmap["001"], "full");
          app.toast("正在试听剑桥英音 (en-GB)：immediately");
        });

        // 第2行：播英音时音效自动闪避压至 30%
        var duckPill = rows[1].querySelector(".toggle-pill");
        if (duckPill) {
          duckPill.textContent = st.settings.audioDucking !== false ? "已开启 ✓" : "已关闭";
        }
        rows[1].addEventListener("click", function () {
          st.settings.audioDucking = !st.settings.audioDucking;
          window.KET_STATE.save();
          window.KET_AUDIO.playClick();
          if (duckPill) {
            duckPill.textContent = st.settings.audioDucking ? "已开启 ✓" : "已关闭";
          }
          app.toast(
            st.settings.audioDucking
              ? "已开启英音闪避（播语音时音效压至 30%）"
              : "已关闭英音闪避"
          );
        });
      }

      var keepBtn = screenEl.querySelector(".btn-keep-safe");
      if (keepBtn) {
        keepBtn.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          app.go("P01");
        });
      }

      var resetBtn = screenEl.querySelector(".btn-warn-reset");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          window.KET_AUDIO.playClick();
          window.KET_STATE.resetLocalProgress();
          app.toast("已重置本机学习记录（已内购解锁权益保留）");
          app.go("P01");
        });
      }
    }
  };
})();

// 荔枝KET词卡助手 v1 - 主路由、定时器防泄漏管理与全局应用入口
(function () {
  var timers = [];
  var intervals = [];
  var toastTimer = null;
  var currentPage = "P01";
  var isNavigating = false;

  function clearAllTimers() {
    while (timers.length > 0) {
      window.clearTimeout(timers.pop());
    }
    while (intervals.length > 0) {
      window.clearInterval(intervals.pop());
    }
    if (toastTimer) {
      window.clearTimeout(toastTimer);
      toastTimer = null;
    }
  }

  function setTimer(fn, delay) {
    var id = window.setTimeout(fn, delay);
    timers.push(id);
    return id;
  }

  function setManagedInterval(fn, delay) {
    var id = window.setInterval(fn, delay);
    intervals.push(id);
    return id;
  }

  function showToast(msg, isWarn) {
    var screenEl = document.getElementById("phone-screen");
    if (!screenEl) return;
    var old = screenEl.querySelector(".ket-toast");
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var div = document.createElement("div");
    div.className = "ket-toast" + (isWarn ? " is-warn" : "");
    div.setAttribute("role", "status");
    div.textContent = msg;
    screenEl.appendChild(div);

    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      if (div && div.parentNode) div.parentNode.removeChild(div);
    }, 1800);
  }

  function go(pageId) {
    var pages = (window.KET_TEMPLATES && window.KET_TEMPLATES.PAGES) || {};
    var pid = String(pageId || "P01").toUpperCase();
    if (!pages[pid]) pid = "P01";

    clearAllTimers();
    currentPage = pid;
    isNavigating = true;
    try {
      if (window.location.hash !== "#" + pid) {
        window.history.replaceState(null, "", "#" + pid);
      }
    } catch (e) {}
    isNavigating = false;

    var tpl = pages[pid];
    var screenEl = document.getElementById("phone-screen");
    var captionEl = document.getElementById("screen-caption");
    if (captionEl && tpl.caption) {
      captionEl.textContent = tpl.caption;
    }
    if (tpl.title) {
      document.title = tpl.title;
    }

    if (screenEl) {
      screenEl.className = tpl.screenClass;
      screenEl.setAttribute("data-page", pid);
      screenEl.innerHTML = tpl.html;

      if (window.KET_VIEWS && window.KET_VIEWS[pid] && typeof window.KET_VIEWS[pid].mount === "function") {
        window.KET_VIEWS[pid].mount(screenEl, window.KET_APP);
      }
    }

    // 同步桌面端快速跳页高亮（仅桌面端可见）
    var jumpBtns = document.querySelectorAll(".desktop-page-switcher button");
    jumpBtns.forEach(function (b) {
      b.classList.toggle("is-active", b.dataset.pid === pid);
    });
  }

  function init() {
    var svgWrap = document.getElementById("ket-svg-defs");
    if (svgWrap && window.KET_TEMPLATES && window.KET_TEMPLATES.SVG_SYMBOLS) {
      svgWrap.innerHTML = window.KET_TEMPLATES.SVG_SYMBOLS;
    }

    // 桌面端快速跳页栏绑定
    var switcher = document.getElementById("desktop-page-switcher");
    if (switcher && window.KET_TEMPLATES && window.KET_TEMPLATES.PAGES) {
      var keys = Object.keys(window.KET_TEMPLATES.PAGES).sort();
      switcher.innerHTML = keys
        .map(function (k) {
          return '<button type="button" data-pid="' + k + '">' + k + "</button>";
        })
        .join("");
      switcher.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          go(btn.dataset.pid);
        });
      });
    }

    window.addEventListener("hashchange", function () {
      if (isNavigating) return;
      var h = (window.location.hash || "").replace(/^#/, "").toUpperCase();
      if (h && window.KET_TEMPLATES && window.KET_TEMPLATES.PAGES[h]) {
        go(h);
      }
    });

    var initHash = (window.location.hash || "").replace(/^#/, "").toUpperCase();
    if (initHash && window.KET_TEMPLATES && window.KET_TEMPLATES.PAGES[initHash]) {
      go(initHash);
    } else {
      go("P01");
    }
  }

  window.KET_APP = {
    go: go,
    getCurrentPage: function () {
      return currentPage;
    },
    setTimer: setTimer,
    setInterval: setManagedInterval,
    clearAllTimers: clearAllTimers,
    toast: showToast
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

s.forEach(function(e){e.style.transform='scale('+k+')';var p=e.parentElement;if(p){p.style.paddingTop=Math.max(0,(h-844*k)/2)+'px'}});}
